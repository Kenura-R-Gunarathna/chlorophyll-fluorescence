name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgGitCommitId: 'c82f74667287d3dc386bce81e44964370c91a289'
        
    - name: Configure CMake
      working-directory: lgplot
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      
    - name: Build
      working-directory: lgplot
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      
    - name: Package
      run: |
        mkdir release
        if (Test-Path "lgplot\build\Release\lgplot.exe") {
          copy lgplot\build\Release\lgplot.exe release\
        } elseif (Test-Path "lgplot\build\lgplot.exe") {
          copy lgplot\build\lgplot.exe release\
        }
        # Copy any DLLs from build directory
        Get-ChildItem -Path lgplot\build -Filter "*.dll" -Recurse | Copy-Item -Destination release\ -ErrorAction SilentlyContinue
        # Copy vcpkg DLLs if they exist
        $vcpkgBin = "${{ github.workspace }}\vcpkg\installed\x64-windows\bin"
        if (Test-Path $vcpkgBin) {
          Get-ChildItem -Path $vcpkgBin -Filter "*.dll" | Copy-Item -Destination release\ -ErrorAction SilentlyContinue
        }
        copy README.md release\
        Compress-Archive -Path release\* -DestinationPath lgplot-Windows-x64.zip
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lgplot-Windows-x64
        path: lgplot-Windows-x64.zip

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: List artifacts
      run: ls -la artifacts/**
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/lgplot-Windows-x64/lgplot-Windows-x64.zip
        body: |
          ## TCD1304 CCD Spectrum Analyzer
          
          ### Downloads
          | Platform | File |
          |----------|------|
          | Windows x64 | `lgplot-Windows-x64.zip` |
          
          ### Windows
          1. Extract the zip file
          2. Run `lgplot.exe`
          
          > **Note**: This application is Windows-only. macOS and Linux are not supported.
          
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
